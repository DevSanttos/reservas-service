server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: reservas-service
  datasource:
    url: jdbc:h2:mem:reservasdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

salas:
  service:
    url: ${SALAS_SERVICE_URL:http://localhost:8082}

equipamentos:
  service:
    url: ${EQUIPAMENTOS_SERVICE_URL:http://localhost:8085}

reservas:
  rabbit:
    exchange: reservas.exchange
    routing-key-confirmada: reserva.confirmada

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true